<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存管理 Demo</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><div class="wrap navin"><a class="logo" href="index.html">← <span>DEV</span> PARTNER</a><span class="small">库存管理 · 原创演示</span></div></header><main class="wrap app"><div class="kicker">INVENTORY DEMO</div><h1>库存管理仪表盘</h1><p class="muted">所有数据仅保存在本机浏览器中，可自由修改并恢复示例数据。支持 CSV 文件导入导出。</p><div class="stats"><div class="stat">商品种类<strong id="total">0</strong></div><div class="stat">库存总数<strong id="stock">0</strong></div><div class="stat">低库存商品<strong id="low">0</strong></div></div><div class="toolbar"><div class="filters"><input class="input" id="query" aria-label="搜索商品" placeholder="搜索商品名称 / SKU"><select class="input" id="cat"><option value="">全部类别</option></select></div><div class="filters"><button class="btn" id="reset">恢复示例</button><button class="btn" id="export">导出 CSV</button><label class="btn">导入 CSV <input id="import" type="file" accept=".csv,text/csv" hidden></label><button class="btn primary" id="add">新增商品</button></div></div><div class="tablebox"><table><thead><tr><th>SKU</th><th>商品名称</th><th>分类</th><th>单价 (¥)</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody id="items"></tbody></table></div><section class="panel hidden" id="editor"><h2 id="formtitle">新增商品</h2><form id="form"><input id="original" type="hidden"><div class="formgrid"><div class="field"><label for="sku">SKU</label><input class="input" required maxlength="40" id="sku"></div><div class="field"><label for="name">商品名称</label><input class="input" required maxlength="80" id="name"></div><div class="field"><label for="category">分类</label><input class="input" required maxlength="40" id="category"></div><div class="field"><label for="price">单价 (¥)</label><input class="input" type="number" min="0" step="0.01" required id="price"></div><div class="field"><label for="quantity">库存数量</label><input class="input" type="number" min="0" step="1" required id="quantity"></div><div class="field"><label for="threshold">预警阈值</label><input class="input" type="number" min="0" step="1" required id="threshold" value="5"></div></div><div class="actions"><button class="btn primary" type="submit">保存商品</button><button class="btn" type="button" id="cancel">取消</button></div></form></section><p class="status" id="status" role="status"></p><div class="notice">本页是面向作品集的前端 Demo。数据仅存浏览器 localStorage，不能用于多人协作或真实企业库存记录。</div></main><script type="module" src="inventory.js"></script></body></html>
