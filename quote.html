<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报价单 Demo</title><link rel="stylesheet" href="style.css"><style>@media print{.nav,.controls,.notice,.footer{display:none!important}.wrap{max-width:100%}.panel{border:none;box-shadow:none}.app{padding:0}.formgrid{display:none}.print{display:block!important}}</style></head><body><header class="nav"><div class="wrap navin"><a class="logo" href="index.html">← <span>DEV</span> PARTNER</a><span class="small">报价单 · 原创演示</span></div></header><main class="wrap app"><div class="kicker">QUOTATION TOOL</div><h1>项目报价单生成器</h1><p class="muted controls">填写项目和金额，自动计算总价，可通过浏览器“打印 / 另存为 PDF”生成报价单。此 Demo 不发送任何信息。</p><div class="panel controls"><div class="formgrid"><div class="field"><label>客户名称</label><input class="input" id="customer" value="示例科技有限公司"></div><div class="field"><label>报价编号</label><input class="input" id="code" value="QT-2026-001"></div><div class="field"><label>项目描述</label><input class="input" id="item" value="前端页面开发与测试"></div><div class="field"><label>数量</label><input class="input" type="number" min="1" step="1" id="qty" value="1"></div><div class="field"><label>单价 (人民币)</label><input class="input" type="number" min="0" step="0.01" id="unit" value="3000"></div><div class="field"><label>税率（演示计算，%）</label><input class="input" type="number" min="0" max="100" step="0.01" id="tax" value="0"></div></div><div class="actions"><button id="print" class="btn primary">打印 / 保存 PDF</button></div></div><section class="panel print" id="doc"><div class="demohead"><h2>项目报价单</h2><div class="pill">DEMO · 非正式报价</div></div><p><b>客户：</b><span id="outCustomer"></span></p><p><b>报价编号：</b><span id="outCode"></span></p><p><b>日期：</b><span id="outDate"></span></p><div class="tablebox"><table><thead><tr><th>项目</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody><tr><td id="outItem"></td><td id="outQty"></td><td id="outUnit"></td><td id="outSub"></td></tr></tbody></table></div><div style="text-align:right;padding:25px"><p>税额：<b id="outTax"></b></p><h2>合计：<span id="outTotal"></span></h2></div><p class="small">本报价单为功能展示，税率仅根据用户输入计算，不代表税务或合同建议。</p></section><div class="notice controls">注意：如果未来用于正式业务，请先确认合同、币种、税务和开票义务。这里不预设跨境税率。</div></main><script src="quote.js"></script></body></html>
